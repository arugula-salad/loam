# The checks every pull request runs, on GitHub-hosted runners. No job here needs a secret,
# and none should: pull requests from forks run this workflow too.
name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      # The store's SQL runs only against Postgres: without it the suite tests the in-memory store
      # alone, which is how a CreateKey with one argument short (#52) reached main.
      - name: Postgres for the store's tests
        run: |
          docker run --rm -d --name loam-pg -p 127.0.0.1:55432:5432 -e POSTGRES_PASSWORD=t postgres:18
          # Over TCP: the image's init runs a temporary server on the socket only, which
          # pg_isready on the socket would mistake for the real one.
          for _ in $(seq 60); do docker exec loam-pg pg_isready -q -h 127.0.0.1 && break; sleep 1; done
          docker exec loam-pg pg_isready -h 127.0.0.1
      - run: make check
        env:
          LOAM_TEST_DATABASE_URL: postgres://postgres:t@127.0.0.1:55432/postgres?sslmode=disable

  # The nodelet on real Firecracker (scripts/kvm-test.sh): GitHub's standard Linux x64 runners
  # have /dev/kvm, readable by root only until a udev rule opens it up.
  kvm:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm /dev/net/tun /dev/userfaultfd
      # The runner's data directory has no reflinks, so every disk clone is a full copy and the
      # root disk runs out. /mnt is the runner's larger scratch disk; the toolchains we don't use
      # make room on top.
      - name: Make disk room
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo mkdir -p /mnt/tmp && sudo chown "$USER" /mnt/tmp
          df -h / /mnt
      - run: make kvm-test
        env:
          TMPDIR: /mnt/tmp
