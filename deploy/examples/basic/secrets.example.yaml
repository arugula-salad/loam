# The Secrets deploy/base reads, with the keys it reads. Not in kustomization.yaml, on purpose:
# keep values out of git. Create them with the commands in docs/INSTALL.md ("Secrets"), or copy
# this file outside the repo, fill it in and `kubectl apply -f` it, or render it from your own
# secret store (External Secrets, Sealed Secrets, SOPS...). Every value here is a placeholder.
apiVersion: v1
kind: Secret
metadata:
  name: loam-database
  namespace: loam
stringData:
  # loam-api's Postgres: a database and a role that owns it.
  uri: postgresql://loam:CHANGE-ME@postgres.example.svc.cluster.local:5432/loam?sslmode=require
---
apiVersion: v1
kind: Secret
metadata:
  name: loam-admin-token
  namespace: loam
stringData:
  # openssl rand -hex 32. Manages projects and keys (docs/API.md); nothing else.
  LOAM_ADMIN_TOKEN: CHANGE-ME
---
apiVersion: v1
kind: Secret
metadata:
  name: loam-node-token
  namespace: loam
stringData:
  # openssl rand -hex 32. What loam-api and the nodelets present to each other (docs/NODE.md).
  LOAM_NODE_TOKEN: CHANGE-ME
---
apiVersion: v1
kind: Secret
metadata:
  name: loam-secret-key
  namespace: loam
stringData:
  # openssl rand -base64 32. Seals project secrets in Postgres; changing it makes every stored
  # secret unreadable.
  LOAM_SECRET_KEY: CHANGE-ME
---
apiVersion: v1
kind: Secret
metadata:
  name: loam-identity-key
  namespace: loam
stringData:
  # openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072. Signs sandbox identity tokens.
  identity.pem: |
    -----BEGIN PRIVATE KEY-----
    CHANGE-ME
    -----END PRIVATE KEY-----
---
apiVersion: v1
kind: Secret
metadata:
  name: loam-broker-ca
  namespace: loam
type: kubernetes.io/tls
stringData:
  # A CA only the nodelets hold, for the credential broker (docs/INSTALL.md has the openssl).
  tls.crt: |
    -----BEGIN CERTIFICATE-----
    CHANGE-ME
    -----END CERTIFICATE-----
  tls.key: |
    -----BEGIN PRIVATE KEY-----
    CHANGE-ME
    -----END PRIVATE KEY-----
---
apiVersion: v1
kind: Secret
metadata:
  name: loam-store
  namespace: loam
stringData:
  # The snapshot bucket's key: read, write and delete on that bucket alone.
  AWS_ACCESS_KEY_ID: CHANGE-ME
  AWS_SECRET_ACCESS_KEY: CHANGE-ME
