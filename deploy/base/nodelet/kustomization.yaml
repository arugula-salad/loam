# The nodelet DaemonSet on its own, so an overlay can instantiate it again for nodes of another
# size (docs/INSTALL.md, "Sizing"): a kustomization whose resources are this directory, with a
# nameSuffix and patches. Its image is pinned here, not in ../kustomization.yaml, so every copy
# carries it.
#
# The digest below is pinned by .github/workflows/images.yml (scripts/pin-images.sh). Never edit
# it by hand.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - daemonset.yaml
images:
  - name: loam-nodelet
    newName: ghcr.io/arugula-salad/loam-nodelet
    digest: sha256:573978e7ec5229598d12800b618e29f7c9239c1bf2999f6e9c01fd0dbb0cd762
